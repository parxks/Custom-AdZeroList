name: Build domains.txt

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lists/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: adzerolist-domains
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Build domains.txt
        run: ./scripts/build.sh

      - name: Commit updated list
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add outputs/domains.txt
          if git diff --cached --quiet; then
            echo 'domains.txt is unchanged.'
            exit 0
          fi

          git commit -m 'Update optimized domains.txt'
          git push
